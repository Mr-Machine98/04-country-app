<section>
    <table class="table table-md mt-2 w-full">
        <thead>
            <tr>
                <th>#</th>
                <th>Icon</th>
                <th>Flag</th>
                <th>Name</th>
                <th>Capital</th>
                <th>Population</th>
            </tr>
        </thead>
        <tbody>
            @for (c of countries(); track c; let index = $index) {
                <tr>
                    <td>{{index + 1}}</td>
                    <td>{{c.emoji}}</td>
                    <td>
                        <img [src]="c.flagSvg" [alt]="c.name"
                            class="w-10"/>
                    </td>
                    <td>{{c.name}}</td>
                    <td>{{c.capital}}</td>
                    <td>
                        <span class="badge badge-secondary">
                            {{c.population | number}}
                        </span>
                    </td>
                    <td><a 
                        [routerLink]="['/country/by', c.cca2]"
                        class="link-primary cursor-pointer">More Info</a></td>
                </tr>
            }
        </tbody>
    </table>
</section>
