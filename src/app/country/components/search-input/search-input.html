<section class="flex flex-row gap-2 mt-2">
    <input type="text"
        class="input inpuut-bordered mr-2 w-56"
        [placeholder]="placeholder()"
        autofocus
        #txtSearch
        (keyup.enter)="emitSearch.emit(txtSearch.value)">
    <button class="btn btn-primary"
        (click)="emitSearch.emit(txtSearch.value)">Search</button>
</section>
