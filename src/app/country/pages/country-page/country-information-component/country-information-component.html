<section class="mx-10">
    <h1 class="text-3xl">{{country()?.name}}</h1>
    <h2 class="text-xl font-thin">Population: {{country()?.population | number}}</h2>
</section>

<div class="stats shadow mx-5">
  <div class="stat place-items-center">
    <div class="stat-title">Population</div>
    <div class="stat-value">{{country()?.population | number}}</div>
    <div class="stat-desc">From {{currentYear()}}</div>
  </div>

  <div class="stat place-items-center">
    <div class="stat-title">Name</div>
    <div class="stat-value text-secondary">{{country()?.name}}</div>
    <div class="stat-desc text-secondary">{{country()?.region}}</div>
  </div>

  <div class="stat place-items-center">
    <div class="stat-title">Sub Region</div>
    <div class="stat-value">{{country()?.subRegion}}</div>
    <div class="stat-desc">{{country()?.region}}</div>
  </div>

  <div class="stat place-items-center">
    <div class="stat-title">Capital</div>
    <div class="stat-value">{{country()?.capital}}</div>
    <div class="stat-desc"><svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path fill="none" stroke="currentColor"
                        d="M19.5 10.5V19m-10-8.5V19m-5-8.5V19m10-8.5V19M2 21h20M0 23.5h24m-.5-15.75v.75H.5v-.75C5 6 9.186 3.577 11.438.875L11.75.5h.5l.312.375C14.814 3.577 19 6 23.5 7.75Z" />
                </svg></div>
  </div>

  
</div>

<section class="diff aspect-16/9" tabindex="0">
  <div class="diff-item-1" role="img" tabindex="0">
    <img [alt]="country()?.name" [src]="country()?.flagSvg" />
  </div>
  <div class="diff-item-2" role="img">
    <img class="blur brightness-75"
      [alt]="country()?.name"
      [src]="country()?.flagSvg" />
  </div>
  <div class="diff-resizer"></div>
</section>
